; Projeto: firmware proprio para o LSN50v2 / LoRa ST (STM32L072CZT6)
;
;   pio run -e l072      -> compila o firmware do alvo (ARM Cortex-M0+)
;   pio run -e native    -> compila e roda os testes de host do nucleo portatil
;
; O nucleo em core/ nao inclui nenhum header de MCU e por isso compila tambem
; no PC (gcc), onde e coberto por testes.

[platformio]
default_envs = l072
; compila a partir da raiz do projeto e seleciona as pastas por ambiente
src_dir = .

[env]
build_flags =
    -Wall
    -Wextra
    -Wshadow
    -std=gnu11
build_unflags = -std=gnu++11

[env:l072]
platform = ststm32
board = lsn50v2
framework = cmsis
build_src_filter = +<src/> +<core/>
build_flags =
    ${env.build_flags}
    -DCORE_TARGET_MCU=1
    -Icore
    -Isrc

[env:native]
platform = native
build_src_filter = +<core/> +<tests/>
build_flags =
    ${env.build_flags}
    -Icore
    -g
    -fsanitize=address,undefined
